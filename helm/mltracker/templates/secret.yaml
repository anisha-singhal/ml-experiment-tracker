{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mltracker.secretName" . }}
  labels:
    {{- include "mltracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData, not data: Helm writes it verbatim and Kubernetes base64-encodes
  # it. Hand-encoding is where the stray newline from `echo` without -n creeps in.
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:5432/%s" .Values.postgres.username .Values.postgres.password (include "mltracker.postgresHost" .) .Values.postgres.database | quote }}
{{- end }}
