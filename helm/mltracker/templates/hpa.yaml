{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "mltracker.fullname" . }}-backend
  labels:
    {{- include "mltracker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "mltracker.fullname" . }}-backend
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # A percentage of the container's CPU *request*, not of a core. With
          # no request set there is nothing to take a percentage of and the HPA
          # reports <unknown> forever.
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
