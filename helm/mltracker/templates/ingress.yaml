{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mltracker.fullname" . }}
  labels:
    {{- include "mltracker.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # /api first. Rule order in the manifest does not decide matching -
          # ingress-nginx sorts by path length, longest first - but keeping the
          # more specific rule first makes the intent readable.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "mltracker.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mltracker.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
