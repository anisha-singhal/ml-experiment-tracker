apiVersion: v1
kind: Service
metadata:
  name: {{ include "mltracker.fullname" . }}-frontend
  labels:
    {{- include "mltracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "mltracker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
