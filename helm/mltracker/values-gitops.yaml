# The values Argo CD deploys from.
#
# This file is the deployment record. The image tags below are the exact
# commit that CI built and published to GHCR, which is why changing the
# deployed version is a commit rather than a command: edit these two tags,
# push, and Argo CD converges the cluster onto the new images.
#
# Pinned to a full SHA, never :main and never :latest — a moving tag means a
# pod restart silently changes what is running.
backend:
  image:
    tag: "71c3f2e53627eac5ba277796861242d25c350077"
    pullPolicy: IfNotPresent
  replicaCount: 2

frontend:
  image:
    tag: "71c3f2e53627eac5ba277796861242d25c350077"
    pullPolicy: IfNotPresent
  replicaCount: 2

ingress:
  enabled: true
  # The kind cluster maps hostPort 8080 to the ingress controller's port 80,
  # so localhost is browsable without touching /etc/hosts. A cloud deployment
  # overrides this with a real DNS name, as values-prod.yaml does.
  host: localhost

# Needs metrics-server, which kind does not ship: install it first with
# monitoring/metrics-server-values.yaml, or the HPA sits at <unknown>/70%.
# Argo CD ignores /spec/replicas on the backend so it never fights the HPA.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

postgres:
  persistence:
    enabled: true
    size: 1Gi

# kube-prometheus-stack is installed in this cluster, so the ServiceMonitor
# CRD exists and Prometheus can be told to scrape the backend. Off in
# values.yaml, because applying a ServiceMonitor to a cluster without the
# CRD fails the whole sync.
serviceMonitor:
  enabled: true
