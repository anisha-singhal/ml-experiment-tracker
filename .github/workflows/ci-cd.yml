name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- test ----
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        # A non-zero exit here fails the job, and every later job needs it, so a
        # failing test can never produce a pushed image.
        env:
          DATABASE_URL: sqlite://
        run: python -m pytest -v

  # ------------------------------------------------------------ frontend ----
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------------- build, scan, publish ---
  images:
    name: Build, scan and push ${{ matrix.component }}
    runs-on: ubuntu-latest
    # Fan-in: both quality gates must pass before anything is built.
    needs: [test, build-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          # load, not push: the image goes into the runner's docker daemon so
          # trivy can scan it BEFORE it is published. Pushing first would mean
          # a vulnerable image is already public by the time the gate runs.
          load: true
          push: false
          tags: ${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.58.1"
        run: |
          # The release tarball directly, rather than contrib/install.sh piped
          # into sh: that script lives on the project's main branch, so it can
          # change under us, and when it fails it exits 1 having already printed
          # that it resolved the version - which says nothing about what broke.
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Trivy scan (report)
        run: |
          trivy image --scanners vuln --no-progress \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            ${{ matrix.component }}:${{ github.sha }}

      - name: Security gate - fail on fixable HIGH or CRITICAL
        run: |
          # --ignore-unfixed: a CVE with no released patch cannot be acted on by
          # this repository, so failing on it would block every build for reasons
          # outside our control. Fixable HIGH/CRITICAL findings DO fail the job.
          trivy image --scanners vuln --no-progress \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ${{ matrix.component }}:${{ github.sha }}

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image tagged with the commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Tagged by commit SHA, never :latest. A deployment then names exactly
          # one immutable build, and a rollback is a different SHA rather than a
          # hope that :latest has not moved.
          SRC="${{ matrix.component }}:${{ github.sha }}"
          DEST="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.component }}"

          # Registries reject uppercase paths; repository owners can contain them.
          DEST="$(echo "$DEST" | tr '[:upper:]' '[:lower:]')"

          docker tag  "$SRC" "$DEST:${{ github.sha }}"
          docker push "$DEST:${{ github.sha }}"

          # A moving "main" tag alongside the immutable SHA, for humans.
          docker tag  "$SRC" "$DEST:main"
          docker push "$DEST:main"

          echo "### Published \`$DEST:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------- deploy ----
  deploy:
    name: Deploy (manifest render)
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint the chart
        run: helm lint helm/mltracker

      - name: Render manifests for this commit
        # Proves the chart templates cleanly against the exact images this run
        # published. The cluster itself is not reachable from GitHub-hosted
        # runners, so applying is done from a machine with kubeconfig.
        run: |
          OWNER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          helm template mltracker helm/mltracker \
            --namespace ml-tracker \
            --set backend.image.repository=ghcr.io/${OWNER}-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=ghcr.io/${OWNER}-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            > rendered.yaml
          echo "rendered $(grep -c '^kind:' rendered.yaml) objects"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-${{ github.sha }}
          path: rendered.yaml
          retention-days: 7
