# Local cluster for the Kubernetes and observability modules.
# 1 control-plane + 2 workers, so Service load balancing and pod spread across
# nodes are real rather than simulated.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mltracker
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080      # 80 and 3000 are often taken on a dev laptop
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
