# Listens on 8080, not 80: ports below 1024 need CAP_NET_BIND_SERVICE, and this
# container runs as an unprivileged user.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The browser calls same-origin /api; nginx forwards to the backend Service.
    # BACKEND_URL is substituted at container start by the entrypoint, so one
    # image works for compose (backend:8000) and Kubernetes alike.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Nginx's own liveness, answered without touching the backend.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths return index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
